<!doctype html>
<html lang="pt-BR">
<head>

<title>Página não encontrada | Matheus Malta</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Geist:wght@400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main id="main" style="min-height:100vh;display:grid;align-content:center">
  <div class="wrap pre">
    <p class="mono">404</p>
    <h1>Página não encontrada<span style="color:var(--accent)">.</span></h1>
    <p>O endereço não existe ou foi movido. / This page does not exist or was moved.</p>
    <p style="margin-top:24px"><a class="btn primary" href="/">Voltar ao portfólio</a></p>
  </div>

</html>
